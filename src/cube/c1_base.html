<title>KN189 Event Cube</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: instrument-panel workspace — controls strip, big timeline canvas, signals rail on the right */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#15202b; --muted:#566370; --line:#d3d9de; --grid:#e3e8ec; --soft:#f6f8f9;
  --accent:#0d6b8a; --pbo:#8b97a3;
  --c-ex:#1f7fa6; --c-ae:#cf442e; --c-lb:#7558c2; --c-tr:#2b8653; --c-cm:#b98110; --c-ds:#15202b;
  --g1:#e9b44c; --g2:#e27f36; --g3:#cf442e; --g4:#931d2c; --g5:#3a0c15;
  --ok:#2b8653; --warn:#b98110; --crit:#cf442e;
  --f-disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1318; --panel:#141c23; --ink:#e3eaef; --muted:#93a2ae; --line:#26323c; --grid:#1b252e; --soft:#11181e;
  --accent:#43aed0; --pbo:#6d7a86;
  --c-ex:#4aaad2; --c-ae:#ef6b53; --c-lb:#a68df0; --c-tr:#52c17f; --c-cm:#e3ad3c; --c-ds:#e3eaef;
  --g1:#e9c063; --g2:#ec9450; --g3:#ef6b53; --g4:#e0405a; --g5:#ff9fb0;
  --ok:#52c17f; --warn:#e3ad3c; --crit:#ef6b53; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1318; --panel:#141c23; --ink:#e3eaef; --muted:#93a2ae; --line:#26323c; --grid:#1b252e; --soft:#11181e;
  --accent:#43aed0; --pbo:#6d7a86;
  --c-ex:#4aaad2; --c-ae:#ef6b53; --c-lb:#a68df0; --c-tr:#52c17f; --c-cm:#e3ad3c; --c-ds:#e3eaef;
  --g1:#e9c063; --g2:#ec9450; --g3:#ef6b53; --g4:#e0405a; --g5:#ff9fb0;
  --ok:#52c17f; --warn:#e3ad3c; --crit:#ef6b53; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;display:flex;flex-direction:column;gap:12px;max-width:1500px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--f-disp);font-weight:700;font-size:30px;letter-spacing:.01em;margin:0;line-height:1;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted);font-size:13px;max-width:70ch}
.sub b{color:var(--crit);font-weight:600}
.views{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.tab{font:600 13px/1 var(--f-body);padding:9px 14px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.tab.on{background:var(--ink);color:var(--bg)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-end;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.grp{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font:600 10.5px/1 var(--f-body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
select{font:500 13px var(--f-body);color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:5px 8px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-mono);padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--muted);cursor:pointer}
.chip i{width:9px;height:9px;border-radius:2px;background:var(--dc);opacity:.35}
.chip.on{color:var(--ink);border-color:var(--dc)}
.chip.on i{opacity:1}
.switch{display:inline-flex;align-items:center;gap:8px;font:600 13px var(--f-body);cursor:pointer;padding-bottom:4px}
.switch input{width:16px;height:16px;accent-color:var(--accent)}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}
.viewport{position:relative;height:clamp(460px,calc(100vh - 250px),900px);background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;touch-action:none;min-width:0}
#cv{display:block;width:100%;height:100%;cursor:grab}
#cv.drag{cursor:grabbing}
#three{position:absolute;inset:0}
#three canvas{display:block;width:100%;height:100%;cursor:grab}
.zoombar{position:absolute;right:10px;bottom:10px;display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.zoombar button{font:600 15px/1 var(--f-body);min-width:30px;height:28px;border:0;border-radius:4px;background:transparent;color:var(--ink);cursor:pointer}
.zoombar button:hover{background:var(--soft)}
#zFit{font-size:12px}
#zLvl{font:500 11px var(--f-mono);color:var(--muted);min-width:64px;text-align:center}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:12px/1.4 var(--f-body);padding:6px 8px;border-radius:5px;max-width:260px;z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tip b{font-family:var(--f-mono);font-weight:500}
#lbl3d{position:absolute;inset:0;pointer-events:none}
#lbl3d span{position:absolute;font:600 11px var(--f-mono);padding:2px 6px;border-radius:3px;background:var(--panel);border:1px solid var(--line);transform:translate(-100%,-50%);white-space:nowrap}
.spread{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:600 12px var(--f-body)}
.spread input{width:140px;accent-color:var(--accent)}
.xrnote{position:absolute;right:10px;top:10px;max-width:300px;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
.side{display:flex;flex-direction:column;gap:12px;min-width:0;max-height:clamp(460px,calc(100vh - 250px),900px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.card h2{font-family:var(--f-disp);font-weight:700;font-size:18px;letter-spacing:.02em;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.card h2 span{font:500 12px var(--f-mono);color:var(--muted)}
.sigcard{flex:1;display:flex;flex-direction:column;min-height:180px}
#sigList{list-style:none;margin:0;padding:0;overflow:auto;display:flex;flex-direction:column;gap:6px;flex:1}
#sigList li{display:grid;grid-template-columns:4px 1fr;gap:9px;padding:7px 8px;border-radius:5px;background:var(--soft);cursor:pointer;border:1px solid transparent}
#sigList li:hover,#sigList li.on{border-color:var(--line)}
#sigList li .sv{border-radius:2px}
#sigList li .t{font:600 13px var(--f-body)}
#sigList li .d{font-size:12px;color:var(--muted)}
#sigList li .id{font:500 11px var(--f-mono);color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.pid{font:500 15px var(--f-mono);margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.arm{font:600 11px var(--f-body);padding:2px 7px;border-radius:999px;color:#fff}
.empty{color:var(--muted);font-size:13px;margin:0}
.evlist{margin:8px 0 0;padding:0;list-style:none;font-size:12px;display:flex;flex-direction:column;gap:2px;max-height:130px;overflow:auto}
.evlist li{display:flex;gap:8px}
.evlist .day{font-family:var(--f-mono);color:var(--muted);min-width:46px;text-align:right}
.btn{font:600 12px var(--f-body);border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:5px;padding:6px 10px;cursor:pointer;margin-top:8px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block}
.hint{margin:0;font-size:12px;color:var(--muted)}
@media (max-width:900px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .viewport{height:520px}
  .side{max-height:none}
  .sigcard{max-height:360px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
